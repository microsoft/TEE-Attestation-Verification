name: "COSE CI"

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-cose-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  native:
    name: Native build and test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Build native with OpenSSL backend
        run: cargo build --manifest-path cose/Cargo.toml --no-default-features --features "crypto_openssl"

      - name: Test native with OpenSSL backend
        run: cargo test --manifest-path cose/Cargo.toml --no-default-features --features "crypto_openssl" -- --nocapture
