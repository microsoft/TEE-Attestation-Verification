name: "COSE CI"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  wasm:
    name: WASM64 pure-Rust build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install rust
        run: |
          rustup update nightly
          rustup +nightly component add rust-src

      - name: Setup WASM tooling
        run: |
          cargo install wasm-bindgen-cli

      # COSE depends on EverParse CBOR code that requires 64-bit usize, so it
      # must be compiled as wasm64 with Cargo nightly build-std. wasm-bindgen
      # only generates JS bindings from the already-built wasm artifact.
      - name: Build WASM64 with pure-Rust backend
        run: cargo +nightly build -Z build-std=std,panic_abort --manifest-path cose/Cargo.toml --target wasm64-unknown-unknown --no-default-features --features "crypto_pure_rust" --release

      - name: Generate WASM bindings
        run: wasm-bindgen --target web --out-dir cose/pkg target/wasm64-unknown-unknown/release/tee_attestation_verification_cose.wasm

      - name: Compile WASM64 tests with pure-Rust backend
        run: cargo +nightly test -Z build-std=std,panic_abort --manifest-path cose/Cargo.toml --target wasm64-unknown-unknown --no-default-features --features "crypto_pure_rust" --no-run

  native:
    name: Native pure-Rust build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Build native with pure-Rust backend
        run: cargo build --manifest-path cose/Cargo.toml --no-default-features --features "crypto_pure_rust"

      - name: Test native with pure-Rust backend
        run: cargo test --manifest-path cose/Cargo.toml --no-default-features --features "crypto_pure_rust" -- --nocapture
