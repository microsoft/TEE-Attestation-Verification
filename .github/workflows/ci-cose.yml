name: "COSE CI"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  wasm:
    name: WASM pure-Rust build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Setup WASM tooling
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli
          cargo install wasm-pack --version 0.13.1 --locked

      - name: Build WASM with pure-Rust backend
        working-directory: cose
        run: wasm-pack build --target web --no-default-features --features "crypto_pure_rust"

      - name: Test WASM with pure-Rust backend
        working-directory: cose
        run: wasm-pack test --node --no-default-features --features "crypto_pure_rust"

  native:
    name: Native pure-Rust build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Build native with pure-Rust backend
        run: cargo build --manifest-path cose/Cargo.toml --no-default-features --features "crypto_pure_rust"

      - name: Test native with pure-Rust backend
        run: cargo test --manifest-path cose/Cargo.toml --no-default-features --features "crypto_pure_rust" -- --nocapture
