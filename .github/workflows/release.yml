name: Release

on:
  push:
    tags:
      - "tav-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example tav-0.1.0
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      commit_sha: ${{ steps.prepare.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate tag and version
        id: prepare
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            candidate_tag="${GITHUB_REF_NAME}"
          else
            candidate_tag="${INPUT_TAG}"
          fi

          if [[ ! "${candidate_tag}" =~ ^tav-.+$ ]]; then
            echo "Release tags must use the tav-<version> format, got: ${candidate_tag}" >&2
            exit 1
          fi

          git fetch --force --tags origin "refs/tags/${candidate_tag}:refs/tags/${candidate_tag}"

          commit_sha=$(git rev-parse "refs/tags/${candidate_tag}^{commit}")
          normalized_version="${candidate_tag#tav-}"

          for manifest in attestation/Cargo.toml caci/Cargo.toml; do
            manifest_version=$(git show "${commit_sha}:${manifest}" | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["package"]["version"])')

            if [[ "${manifest_version}" != "${normalized_version}" ]]; then
              echo "Tag ${candidate_tag} does not match ${manifest} version ${manifest_version}" >&2
              exit 1
            fi
          done

          echo "tag=${candidate_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${normalized_version}" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"

  validate_release:
    name: Validate release
    runs-on: ubuntu-latest
    needs: prepare_release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare_release.outputs.commit_sha }}

      - name: Install rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable

      - name: Setup WASM tooling
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked

      - name: Build with openssl
        run: cargo build -p tee-attestation-verification-lib --no-default-features --features "crypto_openssl"

      - name: Test offline with openssl
        run: cargo test -p tee-attestation-verification-lib --no-default-features --features "crypto_openssl" -- --nocapture

      - name: Build with pure_rust crypto
        run: cargo build -p tee-attestation-verification-lib --no-default-features --features "crypto_pure_rust"

      - name: Test offline with pure_rust crypto
        run: cargo test -p tee-attestation-verification-lib --no-default-features --features "crypto_pure_rust" -- --nocapture

      - name: Build WASM with WebCrypto crypto
        working-directory: attestation
        run: wasm-pack build --target web --no-default-features --features "crypto_webcrypto"

      - name: Test WASM offline
        working-directory: attestation
        run: wasm-pack test --node --no-default-features --features "crypto_pure_rust"

      - name: Test WASM offline with WebCrypto backend
        working-directory: attestation
        run: wasm-pack test --node --no-default-features --features "crypto_webcrypto"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"

      - name: Build WASM for the web-verify-kernel demo
        working-directory: attestation
        run: wasm-pack build --target web --out-dir ../demos/web-verify-kernel/pkg --no-default-features --features "crypto_webcrypto"

      - name: Install web-verify-kernel demo test deps
        working-directory: demos/web-verify-kernel/tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run web-verify-kernel demo e2e test
        working-directory: demos/web-verify-kernel/tests
        run: npm test

      - name: Build WASM for the caci-attestation-verify demo
        working-directory: caci
        run: wasm-pack build --target web --out-dir ../demos/caci-attestation-verify/caci_pkg --no-default-features --features "crypto_webcrypto"

      - name: Install caci-attestation-verify demo test deps
        working-directory: demos/caci-attestation-verify/tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run caci-attestation-verify demo e2e test
        working-directory: demos/caci-attestation-verify/tests
        run: npm test

  package_wasm:
    name: Package WASM artifacts
    runs-on: ubuntu-latest
    needs: prepare_release
    env:
      VERSION: ${{ needs.prepare_release.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare_release.outputs.commit_sha }}

      - name: Install rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable

      - name: Setup WASM tooling
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked

      - name: Build tav-attestation WASM bundle with WebCrypto crypto
        shell: bash
        working-directory: attestation
        run: |
          set -euo pipefail

          mkdir -p ../dist/tav-attestation ../release-artifacts

          wasm-pack build \
            --target web \
            --release \
            --out-dir ../dist/tav-attestation \
            --no-default-features \
            --features "crypto_webcrypto"

          tar -C ../dist -czf "../release-artifacts/tav-attestation-${VERSION}.tar.gz" tav-attestation

      - name: Build tav-caci WASM bundle with WebCrypto crypto
        shell: bash
        working-directory: caci
        run: |
          set -euo pipefail

          mkdir -p ../dist/tav-caci ../release-artifacts

          wasm-pack build \
            --target web \
            --release \
            --out-dir ../dist/tav-caci \
            --no-default-features \
            --features "crypto_webcrypto"

          tar -C ../dist -czf "../release-artifacts/tav-caci-${VERSION}.tar.gz" tav-caci

      - name: Generate release artifact checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd release-artifacts
            sha256sum tav-attestation-${VERSION}.tar.gz tav-caci-${VERSION}.tar.gz > SHA256SUMS
          )

      - name: Upload WASM release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts/*

  create_release:
    name: Create release
    runs-on: ubuntu-latest
    needs:
      - prepare_release
      - validate_release
      - package_wasm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare_release.outputs.commit_sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create --verify-tag --draft --generate-notes "${RELEASE_TAG}" dist/*
