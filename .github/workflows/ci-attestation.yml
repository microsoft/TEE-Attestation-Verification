name: "Attestation CI"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  wasm:
    name: WASM build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Setup WASM tooling
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.122 --locked
          cargo install wasm-pack --version 0.13.1 --locked

      - name: Build WASM
        working-directory: attestation
        run: wasm-pack build --target web --no-default-features --features "crypto_pure_rust"

      - name: Test WASM
        working-directory: attestation
        run: wasm-pack test --node --no-default-features --features "crypto_pure_rust"

      - name: Build WASM with KDS
        run: cargo build --manifest-path attestation/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features "crypto_pure_rust,kds"

  native:
    name: Native build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Build native
        run: cargo build --manifest-path attestation/Cargo.toml --no-default-features --features "crypto_pure_rust"

      - name: Test native
        run: cargo test --manifest-path attestation/Cargo.toml --no-default-features --features "crypto_pure_rust" -- --nocapture

      - name: Build native with KDS
        run: cargo build --manifest-path attestation/Cargo.toml --no-default-features --features "crypto_pure_rust,kds"

      - name: Test native with KDS
        run: cargo test --manifest-path attestation/Cargo.toml --no-default-features --features "crypto_pure_rust,kds" -- --nocapture

  c-ffi:
    name: C FFI demo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Build C FFI demo
        run: |
          cmake -S demos/c-ffi -B demos/c-ffi/build -G Ninja
          cmake --build demos/c-ffi/build

      - name: Check C FFI exports
        run: |
          nm -D --defined-only target/debug/libtee_attestation_verification_lib.so \
            | grep ' tav_snp_verify_attestation'
          nm -D --defined-only target/debug/libtee_attestation_verification_lib.so \
            | grep ' tav_error_code'

      - name: Run C FFI demo
        run: |
          ./demos/c-ffi/build/tav-c-ffi-demo \
            attestation/tests/test_data/milan_attestation_report.bin \
            attestation/src/pinned_arks/milan_ark.pem \
            attestation/tests/test_data/milan_ask.pem \
            attestation/tests/test_data/milan_vcek.pem \
            > c-ffi-demo-output.txt
          grep '^version ' c-ffi-demo-output.txt
          grep '^report_data ' c-ffi-demo-output.txt

      - name: Run C FFI demo failure path
        run: |
          : > c-ffi-empty-report.bin
          set +e
          ./demos/c-ffi/build/tav-c-ffi-demo \
            c-ffi-empty-report.bin \
            attestation/src/pinned_arks/milan_ark.pem \
            attestation/tests/test_data/milan_ask.pem \
            attestation/tests/test_data/milan_vcek.pem \
            > c-ffi-demo-failure-output.txt \
            2> c-ffi-demo-failure-error.txt
          code=$?
          set -e
          test "$code" -eq 1
          test ! -s c-ffi-demo-failure-output.txt
          grep -Fx 'attestation report is empty' c-ffi-demo-failure-error.txt

      - name: Build and run statically linked C FFI demo
        run: |
          cmake -S demos/c-ffi -B demos/c-ffi/build-static -G Ninja -DTAV_LINK_STATIC=ON
          cmake --build demos/c-ffi/build-static
          ./demos/c-ffi/build-static/tav-c-ffi-demo \
            attestation/tests/test_data/milan_attestation_report.bin \
            attestation/src/pinned_arks/milan_ark.pem \
            attestation/tests/test_data/milan_ask.pem \
            attestation/tests/test_data/milan_vcek.pem \
            > c-ffi-demo-static-output.txt
          grep '^version ' c-ffi-demo-static-output.txt
          grep '^report_data ' c-ffi-demo-static-output.txt
          : > c-ffi-empty-report.bin
          set +e
          ./demos/c-ffi/build-static/tav-c-ffi-demo \
            c-ffi-empty-report.bin \
            attestation/src/pinned_arks/milan_ark.pem \
            attestation/tests/test_data/milan_ask.pem \
            attestation/tests/test_data/milan_vcek.pem \
            > c-ffi-demo-static-failure-output.txt \
            2> c-ffi-demo-static-failure-error.txt
          code=$?
          set -e
          test "$code" -eq 1
          test ! -s c-ffi-demo-static-failure-output.txt
          grep -Fx 'attestation report is empty' c-ffi-demo-static-failure-error.txt
