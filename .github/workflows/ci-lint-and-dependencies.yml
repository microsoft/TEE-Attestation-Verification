name: "Lint and dependency CI"

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "23 6 * * 1"

concurrency:
  group: ci-lint-and-dependencies-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy (${{ matrix.target }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: wasm32-unknown-unknown
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check all targets with warnings as errors
        run: bash scripts/check-clippy.sh "${{ matrix.target }}"

  dependencies:
    name: Dependency advisories, licenses, and bans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Limit build concurrency
        run: echo "CARGO_BUILD_JOBS=$(( ($(nproc) + 1) >> 1 ))" >> "$GITHUB_ENV"
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check locked dependencies on all platforms
        run: cargo deny --locked check advisories licenses bans --deny yanked
