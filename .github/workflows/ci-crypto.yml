name: "Crypto CI"

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-crypto-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  native:
    name: Native ${{ matrix.backend.name }} backend
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: OpenSSL
            features: crypto_openssl
          - name: pure-Rust
            features: crypto_pure_rust

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Build with ${{ matrix.backend.name }} backend
        run: cargo build --manifest-path crypto/Cargo.toml --no-default-features --features "${{ matrix.backend.features }}"

      - name: Test with ${{ matrix.backend.name }} backend
        run: cargo test --manifest-path crypto/Cargo.toml --no-default-features --features "${{ matrix.backend.features }}" -- --nocapture

  windows:
    name: Windows CNG backend
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rust
        run: |
          rustup update stable
          rustup default stable

      - name: Build and test each crate with Windows CNG backend
        shell: pwsh
        run: |
          $manifests = @(
            "crypto/Cargo.toml",
            "cose/Cargo.toml",
            "attestation/Cargo.toml",
            "caci/Cargo.toml",
            "ffi/Cargo.toml"
          )
          foreach ($manifest in $manifests) {
            cargo build --manifest-path $manifest --no-default-features --features crypto_windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --manifest-path $manifest --no-default-features --features crypto_windows -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build verification CLI with Windows CNG backend
        run: cargo build --manifest-path attestation/Cargo.toml --bin verify-attestation --no-default-features --features crypto_windows,kds

  wasm:
    name: WASM ${{ matrix.backend.name }} backend
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: WebCrypto
            features: crypto_webcrypto
          - name: pure-Rust
            features: crypto_pure_rust

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Setup WASM tooling
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked

      - name: Check ${{ matrix.backend.name }} backend
        run: cargo check --manifest-path crypto/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features "${{ matrix.backend.features }}"

      - name: Test ${{ matrix.backend.name }} backend
        working-directory: crypto
        run: wasm-pack test --node --no-default-features --features "${{ matrix.backend.features }}"
