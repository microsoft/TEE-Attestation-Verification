name: "Crypto CI"

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-crypto-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  windows-symcrypt:
    name: Windows SymCrypt backend
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rust
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0
          rustc --version

      - name: Install SymCrypt
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "symcrypt.zip"
          $installDir = Join-Path $env:RUNNER_TEMP "symcrypt"
          Invoke-WebRequest `
            -Uri "https://github.com/microsoft/SymCrypt/releases/download/v103.11.0/symcrypt-windows-amd64-release-103.11.0-748c20f1.zip" `
            -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne "5e2a9e60c03a60b952e84a3b50984f0d723a4b3ec1585f9cf6e800d4bd61159e") {
            throw "Unexpected SymCrypt archive SHA-256: $actualHash"
          }
          Expand-Archive -Path $archive -DestinationPath $installDir
          "SYMCRYPT_LIB_PATH=$installDir\dll" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check SymCrypt runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $env:SYMCRYPT_LIB_PATH "symcrypt.dll"
          $version = [version]((Get-Item $runtime).VersionInfo.FileVersion)
          if ($version -lt [version]"103.4.2") {
            throw "SymCrypt runtime $version is older than required version 103.4.2"
          }
          Write-Host "Using SymCrypt runtime $version from $runtime"

      - name: Build workspace with SymCrypt backend
        run: |
          cargo test --workspace --no-default-features --features crypto_symcrypt --no-run
          cargo build --manifest-path ffi/Cargo.toml --no-default-features --features crypto_symcrypt

      - name: Stage SymCrypt runtime
        shell: pwsh
        run: |
          Copy-Item "$env:SYMCRYPT_LIB_PATH\symcrypt.dll" "target\debug\symcrypt.dll" -Force
          Copy-Item "$env:SYMCRYPT_LIB_PATH\symcrypt.dll" "target\debug\deps\symcrypt.dll" -Force

      - name: Test workspace with SymCrypt backend
        run: cargo test --workspace --no-default-features --features crypto_symcrypt -- --nocapture

  linux-symcrypt:
    name: Linux SymCrypt backend
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rust
        run: |
          rustup toolchain install 1.96.0
          rustc --version

      - name: Install SymCrypt
        run: |
          archive="${RUNNER_TEMP}/symcrypt.tar.gz"
          install_dir="${RUNNER_TEMP}/symcrypt"
          curl --fail --location --silent --show-error \
            "https://github.com/microsoft/SymCrypt/releases/download/v103.11.0/symcrypt-linux-generic-amd64-release-103.11.0-748c20f.tar.gz" \
            --output "${archive}"
          echo "844d8e2315060e414bc859af6bdef573ce193a75194d164b885b5fbef5bc41f5  ${archive}" \
            | sha256sum --check
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}"
          echo "LIBRARY_PATH=${install_dir}/lib" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${install_dir}/lib" >> "${GITHUB_ENV}"

      - name: Test workspace with SymCrypt backend
        run: cargo test --workspace --no-default-features --features crypto_symcrypt -- --nocapture

  native:
    name: Native ${{ matrix.backend.name }} backend
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: OpenSSL
            features: crypto_openssl
          - name: pure-Rust
            features: crypto_pure_rust

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Build with ${{ matrix.backend.name }} backend
        run: cargo build --manifest-path crypto/Cargo.toml --no-default-features --features "${{ matrix.backend.features }}"

      - name: Test with ${{ matrix.backend.name }} backend
        run: cargo test --manifest-path crypto/Cargo.toml --no-default-features --features "${{ matrix.backend.features }}" -- --nocapture

  wasm:
    name: WASM ${{ matrix.backend.name }} backend
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: WebCrypto
            features: crypto_webcrypto
          - name: pure-Rust
            features: crypto_pure_rust

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Setup WASM tooling
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked

      - name: Check ${{ matrix.backend.name }} backend
        run: cargo check --manifest-path crypto/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features "${{ matrix.backend.features }}"

      - name: Test ${{ matrix.backend.name }} backend
        working-directory: crypto
        run: wasm-pack test --node --no-default-features --features "${{ matrix.backend.features }}"
