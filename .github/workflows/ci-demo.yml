name: "Demo CI"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  web-verify-kernel:
    name: web-verify-kernel e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Setup WASM tooling
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked

      - name: Build attestation WASM for the demo
        working-directory: attestation
        run: wasm-pack build --target web --out-dir ../demos/web-verify-kernel/pkg --no-default-features --features "crypto_webcrypto"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"

      - name: Install web-verify-kernel Playwright and browsers
        working-directory: demos/web-verify-kernel/tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run web-verify-kernel e2e test
        working-directory: demos/web-verify-kernel/tests
        run: npm test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-verify-kernel-playwright-report
          path: |
            demos/web-verify-kernel/tests/test-results/
            demos/web-verify-kernel/tests/playwright-report/

  c-ffi:
    name: C FFI demo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Build C FFI demo
        run: |
          cmake -S demos/c-ffi -B demos/c-ffi/build -G Ninja
          cmake --build demos/c-ffi/build

      - name: Check C FFI exports
        run: |
          nm -D --defined-only target/debug/libtee_attestation_verification_lib.so \
            | grep ' tav_snp_verify_attestation'
          nm -D --defined-only target/debug/libtee_attestation_verification_lib.so \
            | grep ' tav_error_code'

      - name: Run C FFI demo
        run: |
          ./demos/c-ffi/build/tav-c-ffi-demo \
            attestation/tests/test_data/milan_attestation_report.bin \
            attestation/src/pinned_arks/milan_ark.pem \
            attestation/tests/test_data/milan_ask.pem \
            attestation/tests/test_data/milan_vcek.pem \
            > c-ffi-demo-output.txt
          diff -u demos/c-ffi/test-data/milan-output.golden.txt c-ffi-demo-output.txt

      - name: Run C FFI demo failure path
        run: |
          : > c-ffi-empty-report.bin
          set +e
          ./demos/c-ffi/build/tav-c-ffi-demo \
            c-ffi-empty-report.bin \
            attestation/src/pinned_arks/milan_ark.pem \
            attestation/tests/test_data/milan_ask.pem \
            attestation/tests/test_data/milan_vcek.pem \
            > c-ffi-demo-failure-output.txt \
            2> c-ffi-demo-failure-error.txt
          code=$?
          set -e
          test "$code" -eq 1
          test ! -s c-ffi-demo-failure-output.txt
          diff -u demos/c-ffi/test-data/empty-report-error.golden.txt c-ffi-demo-failure-error.txt

      - name: Build and run statically linked C FFI demo
        run: |
          cmake -S demos/c-ffi -B demos/c-ffi/build-static -G Ninja -DTAV_LINK_STATIC=ON
          cmake --build demos/c-ffi/build-static
          ./demos/c-ffi/build-static/tav-c-ffi-demo \
            attestation/tests/test_data/milan_attestation_report.bin \
            attestation/src/pinned_arks/milan_ark.pem \
            attestation/tests/test_data/milan_ask.pem \
            attestation/tests/test_data/milan_vcek.pem \
            > c-ffi-demo-static-output.txt
          diff -u demos/c-ffi/test-data/milan-output.golden.txt c-ffi-demo-static-output.txt
          : > c-ffi-empty-report.bin
          set +e
          ./demos/c-ffi/build-static/tav-c-ffi-demo \
            c-ffi-empty-report.bin \
            attestation/src/pinned_arks/milan_ark.pem \
            attestation/tests/test_data/milan_ask.pem \
            attestation/tests/test_data/milan_vcek.pem \
            > c-ffi-demo-static-failure-output.txt \
            2> c-ffi-demo-static-failure-error.txt
          code=$?
          set -e
          test "$code" -eq 1
          test ! -s c-ffi-demo-static-failure-output.txt
          diff -u demos/c-ffi/test-data/empty-report-error.golden.txt c-ffi-demo-static-failure-error.txt

  caci-attestation-verify:
    name: E2E test of CACI attestation verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install rust
        run: |
          rustup update stable && rustup default stable
          rustup toolchain install nightly
          rustup +nightly component add rust-src

      - name: Setup WASM tooling
        run: |
          cargo install wasm-bindgen-cli --version 0.2.122 --locked

      # ACI depends on EverParse CBOR code that requires 64-bit usize.
      # wasm64-unknown-unknown does not have a prebuilt rust-std
      # component, so use nightly Cargo build-std with rust-src instead of
      # rustup target add. wasm-bindgen only generates JS bindings from the
      # already-built wasm artifact.
      - name: Build CACI WASM for the demo
        run: |
          cargo +nightly build -Z build-std=std,panic_abort \
            --manifest-path caci/Cargo.toml \
            --target wasm64-unknown-unknown \
            --no-default-features \
            --features "crypto_webcrypto" \
            --release
          wasm-bindgen --target web \
            --out-dir demos/caci-attestation-verify/caci_pkg \
            target/wasm64-unknown-unknown/release/tee_attestation_verification_caci.wasm

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"

      - name: Install caci-attestation-verify Playwright and browsers
        working-directory: demos/caci-attestation-verify/tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run caci-attestation-verify e2e test
        working-directory: demos/caci-attestation-verify/tests
        run: npm test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caci-attestation-verify-playwright-report
          path: |
            demos/caci-attestation-verify/tests/test-results/
            demos/caci-attestation-verify/tests/playwright-report/
