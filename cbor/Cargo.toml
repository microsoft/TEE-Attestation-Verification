[package]
name = "tee-attestation-verification-cbor"
version = "1.0.8"
edition = "2021"
rust-version = "1.77"
repository = "https://github.com/microsoft/TEE-Attestation-Verification"
keywords = ["cbor", "confidentiality"]
description = "CBOR values backed by deterministic and non-deterministic EverCBOR"
authors = ["Max Tropets", "Chris Jensen"]
license = "MIT"

[dependencies]
# project-everest/everparse tag v2026.10.27 resolves to this pinned commit.
cborrs = { git = "https://github.com/project-everest/everparse.git", rev = "a3b54f47c69acd960dec77e17dc5f76d34324b5b" }
cborrs-nondet = { git = "https://github.com/project-everest/everparse.git", rev = "a3b54f47c69acd960dec77e17dc5f76d34324b5b" }
