[package]
name = "tee-attestation-verification-cose"
version = "1.0.2"
edition = "2021"
repository = "https://github.com/microsoft/TEE-Attestation-Verification"
keywords = ["confidentiality", "sev-snp", "tpm"]
description = "COSE verification helpers for TEE attestation verification"
authors = ["Max Tropets", "Chris Jensen"]
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["crypto/default"]
crypto_openssl = ["crypto/crypto_openssl"]
crypto_pure_rust = ["crypto/crypto_pure_rust"]
crypto_webcrypto = ["crypto/crypto_webcrypto"]

[dependencies]
crypto = { package = "tee-attestation-verification-crypto", version = "1.0.2", path = "../crypto", default-features = false }
cborrs = { git = "https://github.com/project-everest/everparse.git", rev = "b3544a15b51e6346f449baa04eb466a185167e4d" } # project-everest/everparse#296
cborrs-nondet = { git = "https://github.com/project-everest/everparse.git", rev = "b3544a15b51e6346f449baa04eb466a185167e4d" } # project-everest/everparse#296

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
